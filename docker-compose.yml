services:
  etcd:
    image: quay.io/coreos/etcd:v3.6.8
    container_name: etcd-server
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - "2379:2379"
    networks:
      - etcd-net

  app:
    build: .
    container_name: spring-etcd-app
    ports:
      - "9220:9220"
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
    depends_on:
      - etcd
    networks:
      - etcd-net

networks:
  etcd-net:
    driver: bridge